version: '3.8'

x-app: &common
  build:
    args:
      BUNDLE_ENTERPRISE__CONTRIBSYS__COM: "${BUNDLE_ENTERPRISE__CONTRIBSYS__COM}"
      BUNDLE_VA__GHE__COM: "${BUNDLE_VA__GHE__COM}"
      IMAGEMAGICK_IMAGE: "${IMAGEMAGICK_IMAGE:-dpokidov/imagemagick:7.1.1-47-bookworm}"
      RUBY_IMAGE: "${RUBY_IMAGE:-ruby:3.4.10-slim-bookworm}"
      # Deliberately no default: an unset CERTS_IMAGE falls through to the Dockerfile's
      # ARG, which is the va-certs image in ECR. Local development goes through the
      # Makefile, which exports CERTS_IMAGE=certs_none so a build needs no ECR access —
      # see docs/setup/running_docker.md. Building this file directly without ECR access
      # therefore needs an explicit CERTS_IMAGE=certs_none.
      CERTS_IMAGE:
    context: .
  environment:
    BUNDLE_ENTERPRISE__CONTRIBSYS__COM: "${BUNDLE_ENTERPRISE__CONTRIBSYS__COM}"
    BUNDLE_VA__GHE__COM: "${BUNDLE_VA__GHE__COM}"
    SETTINGS__DATABASE_URL: "postgis://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DATABASE:-vets_api_development}?pool=4"
    SETTINGS__TEST_DATABASE_URL: "postgis://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DATABASE:-vets_api_test}"
    SETTINGS__REDIS__APP_DATA__URL: "redis://redis:6379"
    SETTINGS__REDIS__SIDEKIQ__URL: "redis://redis:6379"
    SETTINGS__REDIS__RAILS_CACHE__URL: "redis://redis:6379"
  image: vets-api:${DOCKER_IMAGE:-latest}
  volumes:
    - "../vets-api-mockdata:/cache"
    - .:/app:cached
    - ../vets-json-schema:/vets-json-schema:cached
    - shared-vol:/tmp
  working_dir: /app
  depends_on:
    - clamav
    - postgres
    - redis
  links:
    - clamav
    - postgres
    - redis

services:
  clamav:
    image: clamav/clamav
    ports:
      - 33100:3310
    volumes:
      - shared-vol:/vets-api
    platform: linux/amd64
  redis:
    image: redis:6.2-alpine
    ports:
      - 63790:6379
  postgres:
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_connections=200
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      PGDATA: /tmp
    image: postgis/postgis:14-3.3-alpine
    ports:
      - 54320:5432
    volumes:
      - ./data:/var/lib/postgresql/data:cached
  web:
    <<: *common
    ports:
      - 3000:3000
  worker:
    <<: *common
    command: bundle exec sidekiq -q critical,4 -q tasker,3 -q default,2 -q low,1

volumes:
  shared-vol:
