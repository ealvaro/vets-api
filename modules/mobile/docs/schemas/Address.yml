type: object
required:
  - addressPou
  - addressType
properties:
  id:
    type: integer
    example: 157032
  addressLine1:
    type: string
    example: "1493 Martin Luther King Rd"
  addressLine2:
    type: string
    nullable: true
  addressLine3:
    type: string
    nullable: true
  addressPou:
    type: string
    enum: [ "RESIDENCE", "CORRESPONDENCE" ]
    example: "RESIDENCE"
  addressType:
    type: string
    enum: [ "DOMESTIC", "INTERNATIONAL", "MILITARY" ]
    example: "DOMESTIC"
  city:
    type: string
    example: "Fulton"
  countryCodeIso3:
    type: string
    example: "US"
  countryName:
    type: string
    nullable: true
    example: "USA"
  countyCode:
    type: string
    nullable: true
    example: "21067"
  countyName:
    type: string
    nullable: true
    example: "Fayette County"
  internationalPostalCode:
    type: string
    nullable: true
    example: null
  province:
    type: string
    nullable: true
    example: null
  stateCode:
    type: string
    example: "NY"
  zipCode:
    type: string
    example: "97062"
  zipCodeSuffix:
    type: string
    nullable: true
    example: "1234"
