type: object
additionalProperties: false
required:
  - data
properties:
  data:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          example: "23fe358d-6e82-4541-804c-ce7562ba28f4"
          description: Database id
        type:
          type: string
          example: "maintenance_window"
        attributes:
          type: object
          additionalProperties: false
          required:
            - service
            - startTime
            - endTime
          properties:
            service:
              type: string
              enum:
                - caseflow
                - payment_history
                - facility_locator
                - appeals
                - military_service_history
                - claims
                - direct_deposit_benefits
                - disability_rating
                - letters_and_documents
                - immunizations
                - allergies
                - labs_and_tests
                - secure_messaging
                - appointments
                - user_profile_update
                - rx_refill
                - efolder
                - mhv_sm
                - mhv_meds
                - preneed_burial
                - user_contact_update
                - user_demographics
                - travel_pay_features
                - facilities_info
                - power_of_attorney
                - decision_letters
                - referrals
                - debts
                - medical_copays
                - push_prefs
                - veteran_status
              example: "claims"
            startTime:
              type: string
              example: "2019-04-20T14:15:00.000-04:00"
            endTime:
              type: string
              example: "2019-04-20T18:15:00.000Z"