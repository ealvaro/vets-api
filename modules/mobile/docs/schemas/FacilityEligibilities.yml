type: object
additionalProperties: false
required:
  - data
  - meta
properties:
  data:
    type: array
    items:
      $ref: "./FacilityEligibility.yml"
  meta:
    type: object
    additionalProperties: false
    required:
      - pagination
    properties:
      pagination:
        type: object
        additionalProperties: false
        required:
          - currentPage
          - perPage
          - totalPages
          - totalEntries
        properties:
          currentPage:
            type: integer
          perPage:
            type: integer
          totalPages:
            type: integer
          totalEntries:
            type: integer