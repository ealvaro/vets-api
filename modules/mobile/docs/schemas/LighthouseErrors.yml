type: object
additionalProperties: false
required:
  - errors
properties:
  errors:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        code:
          type: string
        title:
          type: string
        detail:
          type: string
        error:
          type: string
        path:
          type: string
        timestamp:
          type: string
        source:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        meta:
          type: object
          properties:
            messages:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  severity:
                    type: string
                  text:
                    type: string