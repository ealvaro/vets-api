type: object
additionalProperties: false
required:
  - data
properties:
  data:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - attributes
        - meta
      properties:
        id:
          type: string
          example: "3be0c7de-bfe1-4101-a326-5567bcd98b63"
          description: Randomly generated UUID
        type:
          type: string
          example: "suggested_address"
        attributes:
          type: object
          additionalProperties: false
          required:
            - addressLine1
            - addressLine2
            - addressLine3
            - addressPou
            - addressType
            - city
            - countryCodeIso3
            - internationalPostalCode
            - province
            - stateCode
            - zipCode
            - zipCodeSuffix
          properties:
            addressLine1:
              type: string
              example: "51 W Weber Rd"
            addressLine2:
              type: string
              nullable: true
            addressLine3:
              type: string
              nullable: true
            addressPou:
              type: string
              example: "RESIDENCE"
            addressType:
              type: string
              example: "DOMESTIC"
            city:
              type: string
              example: "Columbus"
            countryCodeIso3:
              type: string
              nullable: true
              example: "USA"
            internationalPostalCode:
              type: string
              nullable: true
            province:
              type: string
              nullable: true
            stateCode:
              type: string
              nullable: true
              example: "OH"
            zipCode:
              type: string
              nullable: true
              example: "43202"
            zipCodeSuffix:
              type: string
              nullable: true
              example: "1922"
        meta:
          type: object
          additionalProperties: false
          required:
            - address
            - validationKey
          properties:
            address:
              type: object
              additionalProperties: false
              required:
                - confidenceScore
                - addressType
                - deliveryPointValidation
              properties:
                confidenceScore:
                  type: number
                  example: 100.0
                addressType:
                  type: string
                  example: "Domestic"
                deliveryPointValidation:
                  type: string
                  example: "UNDELIVERABLE"
                residentialDeliveryIndicator:
                  type: string
                  example: "RESIDENTIAL"
            validationKey:
              type: string
              nullable: true
              example: "-646932106"
