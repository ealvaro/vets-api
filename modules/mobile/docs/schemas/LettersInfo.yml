type: object
additionalProperties: false
required:
  - name
  - letterType
properties:
  name:
    type: string
    enum:
      - Benefit Summary and Service Verification Letter
      - Benefits and service summary
      - Benefit Summary Letter
      - Benefit Verification Letter
      - Certificate of Eligibility for Home Loan Letter
      - Civil Service Preference Letter
      - Civil service preference
      - Commissary Letter
      - Commissary eligibility
      - Creditable coverage for health care and prescription drugs
      - Creditable prescription drug coverage
      - Dependent Benefit Summary Letter
      - Foreign Medical Program enrollment
      - Foreign Medical Program Enrollment Letter
      - Proof of Creditable Prescription Drug Coverage Letter
      - Proof of Minimum Essential Coverage Letter
      - Proof of minimum essential coverage
      - Proof of Service Letter
      - Proof of service card
      - Proof of VA income
      - Service Verification Letter
      - Service verification
      - TSA PreCheck application fee waiver
      - VA home loan Certificate of Eligibility (COE)
  letterType:
    type: string
    enum:
      - commissary
      - proof_of_service
      - medicare_partd
      - minimum_essential_coverage
      - service_verification
      - civil_service
      - benefit_summary
      - benefit_summary_dependent
      - benefit_verification
      - certificate_of_eligibility
      - certificate_of_eligibility_home_loan
      - foreign_medical_program
  referenceNumber:
    type: string
    description: Only for COE home loan letters
    example: "123456789"
  coeStatus:
    type: string
    description: Only for COE home loan letters
    example: "ELIGIBLE"
  description:
    type: object
    description: Optional structured description when content updates are enabled
    additionalProperties: true
