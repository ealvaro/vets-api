type: object
required:
  - id
  - addressLine1
  - addressPou
  - addressType
  - city
  - countryCodeIso3
properties:
  id:
    type: integer
    example: 577127
  addressMetaData:
    type: object
    additionalProperties: false
    properties:
      confidenceScore:
        type: integer
        example: 100
      addressType:
        type: string
        example: "Domestic"
      deliveryPointValidation:
        type: string
        example: "CONFIRMED"
      residentialDeliveryIndicator:
        type: string
        example: "RESIDENTIAL"
  addressLine1:
    type: string
    example: "1493 Martin Luther King Rd"
  addressLine2:
    type: string
    nullable: true
  addressLine3:
    type: string
    nullable: true
  addressPou:
    type: string
    enum: [ "RESIDENCE", "CORRESPONDENCE" ]
    example: "RESIDENCE"
  addressType:
    type: string
    enum: [ "DOMESTIC", "INTERNATIONAL", "MILITARY" ]
    example: "DOMESTIC"
  city:
    type: string
    example: "Fulton"
  countryCodeIso3:
    type: string
    example: "USA"
  countryName:
    type: string
    nullable: true
    example: "USA"
  internationalPostalCode:
    type: string
    nullable: true
    example: null
  overrideValidationKey:
    type: integer
    nullable: true
    example: 713117306
  province:
    type: string
    nullable: true
    example: null
  stateCode:
    type: string
    nullable: true
    example: "MS"
  zipCode:
    type: string
    nullable: true
    example: "38843"
  zipCodeSuffix:
    type: string
    nullable: true
    example: "1234"
  validationKey:
    type: string
    nullable: true
