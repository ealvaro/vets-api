openapi: 3.0.0
info:
  version: '0'
  title: DGI Education Benefits
  description: |
    ## The API for Veterans My Education Benefits Application.

    My Education Benefits API serves at the final leg of a relay fetching data from an external microservice that interfaces with a pipeline of other microservices which communicate with Chapter 33 Long Term Solution (LTS) as well as VADIR.
  contact:
    name: va.gov
tags:
- name: claimant info
  description: Claimant Information
- name: submit claim
  description: Claim Submissions
- name: claim status
  description: Claim Status
- name: claim letter
  description: Claim Letter
- name: enrollment
  description: Enrollment List
- name: submit enrollment verification
  description: Enrollment Verification Submission
- name: sponsors
  description: Sponsors
servers:
- url: https://sandbox-api.va.gov/meb_api/v0
  description: VA.gov API sandbox environment
  variables:
    version:
      default: v0
- url: https://api.va.gov/meb_api/v0
  description: VA.gov API production environment
  variables:
    version:
      default: v0
paths:
  "/claimant_info":
    post:
      tags:
      - claimant info
      summary: Retrieves a JSON object containing bio and service data for an authenticated
        applicant.
      operationId: getClaimant
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ClaimantInfoRequestBody"
      responses:
        '201':
          description: Retrieves a Claimant object with bio and service data.
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    required:
                    - id
                    - type
                    - attributes
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        "$ref": "#/components/schemas/ClaimantInfoResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '501':
          "$ref": "#/components/responses/NotImplemented"
        '502':
          "$ref": "#/components/responses/BadGateway"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '504':
          "$ref": "#/components/responses/GatewayTimeout"
