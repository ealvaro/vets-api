Sponsors:
  description: Unique identifier in the request body to retrieve sponsor information.
  type: object
  properties:
    ssn:
      type: string
      example: '123456789'
SponsorsResponse:
  description: Response proxied from DGI microservice pipeline.
  type: object
  properties:
    sponsors:
      type: array
      description: Contains one or more sponsor data.
      items:
        type: object
        properties:
          firstName:
            type: string
            example: Jeff
          lastName:
            type: string
            example: Tedford
          sponsorRelationship:
            type: string
            example: spouse
          dateOfBirth:
            type: string
            example: '2021-08-31'
FryDeaSponsorsResponse:
  description: Response proxied from DGI microservice pipeline.
  type: object
  properties:
    sponsors:
      type: array
      description: Contains one or more sponsor data.
      items:
        type: object
        properties:
          firstName:
            type: string
            example: Jeff
          lastName:
            type: string
            example: Tedford
          sponsorRelationship:
            type: string
            example: spouse
          dateOfBirth:
            type: string
            example: '2021-08-31'
