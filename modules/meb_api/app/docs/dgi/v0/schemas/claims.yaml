SubmitCh33ClaimRequestBody:
  description: Ch33 Form data submitted to DGI automation service.
  type: object
  properties:
    claimant:
      description: Parent Object of the form body.
      type: object
      properties:
        claimantId:
          type: number
          example: 99900000200000000
        suffix:
          type: string
          nullable: true
          example: null
        dateOfBirth:
          type: string
          example: 07/11/1994
        firstName:
          type: string
          example: James
        lastName:
          type: string
          example: Bond
        middleName:
          type: string
          example: James
        notificationMethod:
          type: string
          example:
        contactInfo:
          type: object
          properties:
            addressLine1:
              type: string
            addressLine2:
              type: string
            city:
              type: string
            zipcode:
              type: string
            emailAddress:
              type: string
              example: james.bond@test.com
            addressType:
              type: string
            mobilePhoneNumber:
              type: string
              example: '1231231234'
            homePhoneNumber:
              type: string
              example: '1231231234'
            countryCode:
              type: string
              example: US
            stateCode:
              type: string
        preferredContact:
          type: string
          example: EMAIL
        relinquishedBenefit:
          type: object
          properties:
            effRelinquishDate:
              type: string
              format: date
            relinquishedBenefit:
              type: string
              format: date
        additionalConsiderations:
          type: object
          properties:
            activeDutyKicker:
              type: string
            reserveKicker:
              type: string
            academyRotcScholarship:
              type: string
            seniorRotcScholarship:
              type: string
            activeDutyDodRepayLoan:
              type: string
            terminalLeave:
              type: string
        comments:
          type: object
          properties:
            disagreeWithServicePeriod:
              type: boolean
              example:
SubmitTOEClaimRequestBody:
  description: Ch33 Form data submitted to DGI automation service.
  type: object
  properties:
    toeClaimant:
      type: object
      properties:
        dateOfBirth:
          type: string
          example: '2005-04-05'
        firstName:
          type: string
          example: GREG
        lastName:
          type: string
          example: ANDERSON
        middleName:
          type: string
          example: A
        notificationMethod:
          type: string
          example: EMAIL
        contactInfo:
          type: object
          properties:
            addressLine1:
              type: string
              example: 123 Maple St
            city:
              type: string
              example: Plymouth
            zipcode:
              type: string
              example: '02330'
            emailAddress:
              type: string
              example: 'vets.gov.user+1@gmail.com'
            addressType:
              type: string
              example: DOMESTIC
            countryCode:
              type: string
              example: US
            stateCode:
              type: string
              example: MA
        preferredContact:
          type: string
          example: Email
        personCriteria:
          type: object
          properties:
            ssn:
              type: string
              example: '999111111'
    parentOrGuardianSignature:
      type: string
      example: John Hancock
    sponsorOptions:
      type: object
      properties:
        notSureAboutSponsor:
          type: boolean
          example: false
        firstSponsorVaId:
          type: string
          example: '8009623328'
        manualSponsor:
          type: object
          properties:
            firstName:
              type: string
              example: John
            lastName:
              type: string
              example: Hancock
            dateOfBirth:
              type: string
              example: '1988-10-13'
            relationship:
              type: string
              example: Child
    highSchoolDiplomaInfo:
      type: object
      properties:
        highSchoolDiplomaOrCertificate:
          type: boolean
          example: true
        highSchoolDiplomaOrCertificateDate:
          type: string
          example: '2022-06-15'
    directDeposit:
      type: object
      properties:
        directDepositAccountType:
          type: string
          example: checking
        directDepositAccountNumber:
          type: string
          example: '1234567891'
        directDepositRoutingNumber:
          type: string
          example: '123123123'
SubmitClaimResponse:
  description: Submitting Claim to DGI Services for Automation
  type: object
  properties:
    status:
      type: string
      example: 200
ClaimStatusResponse:
  description: Information about submitted CH33 claims status.
  type: object
  properties:
    claimantId:
      description: The unique identifier for the claimant.
      type: number
      example: 990000000000000000
    claimServiceId:
      description: The unique identifier for the specified claim.
      type: number
      example: 99000000113358489
    claimStatus:
      description: The Status of the current claim
      type: string
      enum:
      - ELIGIBLE
      - DENIED
      - IN_PROGRESS
      - SUBMITTED
    confirmationNumber:
      type: number
      nullable: true
      example: null
    receivedDate:
      type: string
      format: date
