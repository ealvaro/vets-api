type: object
required:
  - recipient_id
  - category
  - body
properties:
  recipient_id:
    type: integer
    description: |
      The message recipient. This must be a valid recipient id that is assigned to the user. The list of valid
      recipients for a user can be obtained from the <pre>/v1/messaging/recipients</pre> endpoint.
    example: 1763526
  category:
    type: string
    description: |
      Message category. This must be one of the values returned by the 
      <pre>/v1/messaging/messages/categories</pre> endpoint.
    example: "OTHER"
  body:
    type: string
    example: "What is the proper dosage and how long should I take this medication?"
  subject:
    type: string
    example: "Question about my medication"
  draft_id:
    type: integer
    description: |
      Specifies draft message ID to send.  Draft message is deleted once sent. Note that the recipient_id, category, body, and subject included with this post will overwrite any of original values of the draft.
  station_number:
    type: string
    description: |
      Optional. The station number (facility ID) associated with the recipient's triage group.
      Used for analytics tracking of Oracle Health facility messages. If not provided, facility
      tracking is skipped.
    example: "989"
  prescription_id:
    type: string
    description: |
      Optional. When present on `POST /v1/messaging/messages`, the message is routed to the
      upstream MHV `POST message/renewal` endpoint instead of the standard `POST message` endpoint.
      The Faraday camelcase middleware auto-transforms this to `prescriptionId` for the upstream
      API. For other endpoints that reuse this schema (for example message drafts and reply drafts),
      this field is accepted but ignored and does not change endpoint behavior.
    example: "24654491"
  signature_name:
    type: string
    description: |
      Optional. The name to display in the electronic signature block appended to the message body.
      Both signature_name and signature_date_user_local must be present for the signature to be appended.
    example: "John Smith"
  signature_date_user_local:
    type: string
    format: date
    description: |
      Optional. The date (YYYY-MM-DD) in the user's local timezone when the electronic signature
      was submitted. Both signature_name and signature_date_user_local must be present for the
      signature to be appended. Blank, invalid, or non-ISO 8601 date values are ignored, and the
      request is still accepted without appending the signature.
    example: "2026-04-13"
