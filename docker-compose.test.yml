version: '3.4'
services:
  redis:
    image: ${ECR_REGISTRY_WITH_SLASH}redis:6.2-alpine
  postgres:
    image: ${ECR_REGISTRY_WITH_SLASH}postgis/postgis:14-3.3-alpine
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_connections=200
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  web:
    build:
      context: .
      args:
        sidekiq_license: "${BUNDLE_ENTERPRISE__CONTRIBSYS__COM}"
        userid: "${VETS_API_USER_ID}"
        # Same non-ECR defaults as docker-compose.yml, so devs without ECR access can run
        # the test stack. Without these the Dockerfile's own defaults apply, which are ECR
        # images.
        IMAGEMAGICK_IMAGE: "${IMAGEMAGICK_IMAGE:-dpokidov/imagemagick:7.1.1-47-bookworm}"
        RUBY_IMAGE: "${RUBY_IMAGE:-ruby:3.3.12-slim-bookworm}"
        # No default, unlike the two above, so an unset CERTS_IMAGE resolves to the
        # Dockerfile's ARG — the va-certs image in ECR. CI does not build through this file
        # (it builds the Dockerfile directly and only runs commands here), but a build that
        # does go through it should not silently produce a certless image. `make ci` and
        # friends export CERTS_IMAGE=certs_none for local runs.
        CERTS_IMAGE:
    image: "vets-api:${DOCKER_IMAGE:-latest}"
    volumes:
      - ".:/app"
      - test_bundle:/usr/local/bundle
    environment:
      SETTINGS__DATABASE_URL: "postgis://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DATABASE:-vets_api_development}?pool=4"
      SETTINGS__TEST_DATABASE_URL: "postgis://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DATABASE:-vets_api_test}"
      SETTINGS__REDIS__APP_DATA__URL: "redis://redis:6379"
      SETTINGS__REDIS__SIDEKIQ__URL: "redis://redis:6379"
      POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      CI: "true"
      RAILS_ENV: test
      CC_TEST_REPORTER_ID: '0c396adc254b0317e2c3a89a1c929fd61270b133c944d3e9c0f13b3937a7ce45'
      CHANGE_ID:           "${CHANGE_ID}"
      GIT_URL:             "${GIT_URL}"
      JENKINS_URL:         "${JENKINS_URL}"
      DANGER_GITHUB_API_TOKEN: "${DANGER_GITHUB_API_TOKEN}"
      DISABLE_BOOTSNAP: "true"
    depends_on:
      - postgres
      - redis
    links:
      - postgres
      - redis
volumes:
  test_bundle:
