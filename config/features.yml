      :va_online_scheduling_referral_list_has_appointments is also enabled, the
      GET /vaos/v2/referrals index endpoint computes hasAppointments using ONLY
      VAOS data and skips the EPS call per referral. Used to test whether
      dropping EPS calls resolves the timeouts observed in staging (EPS
      appointments are eventually transcribed into VAOS). Has no effect if the
      outer has_appointments flag is disabled.
  va_online_scheduling_unified_non_primary_care:
    actor_type: user
    enable_in_development: false
    description: >-
      Owned by VAOS (Oracle Health Unified Scheduling). When DISABLED (default,
      pilot mode), VAOS::V2::Unified::CcraCategoryMapper resolves every CCRA
      category_of_care to PRIMARY CARE (vaos_service_type=primaryCare, PC NUCC
      ids, PC name patterns) regardless of whether an explicit CCRA_TO_TARGETS
      entry exists. Each forced override emits a warn-level log + StatsD counter
      so we can see which non-PC referrals are being rerouted. When ENABLED,
      CCRA categories use their explicit CCRA_TO_TARGETS entry; categories with
      no entry still fall back to primaryCare with logging.
  va_online_scheduling_unified_eps_next_available:
    actor_type: user
    enable_in_development: false
    description: >-
      Owned by VAOS (Oracle Health Unified Scheduling). POC kill switch for
      polling Wellhive for each EPS provider's earliest open slot at unified
      provider-search time. ONE draft appointment per (uuid, referral_number)
      is reused across all slot queries for that referral. Disable if Wellhive
      latency is unacceptable; the FE then renders "Schedule to view
      availability" instead of a date.
  va_online_scheduling_unified_name_filter:
    actor_type: user
    enable_in_development: true
    description: >-
      Owned by VAOS (Oracle Health Unified Scheduling). When enabled, applies a
      client-side regex post-filter to Wellhive (EPS) results so only providers
      whose name, facility name, or specialty name matches the category-
      appropriate pattern list are returned. Disable to fall back to NUCC-only
      server-side filtering.
