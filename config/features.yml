  arc_accredited_representative_portal_use_accredited_models:
    actor_type: user
    description: >
      Gates the Accredited Representative Portal migration from the legacy
      Veteran::Service::* models to the AccreditedX models (AccreditedIndividual /
      AccreditedOrganization / Accreditation) across its read-side: POA-request
      associations, holder memberships, claimant-representative authorization, the
      acceptance-mode policy, and notification emails. Off (default) = legacy.
  arc_appoint_a_representative_use_accredited_models:
    actor_type: user
    description: >
      Gates the Appoint a Representative migration to the AccreditedX models: the
      accredited_entities_for_appoint vs original_entities search routing; representative and
      organization resolution across the 21-22/21-22a PDF generation and the digital POA
      submission (AccreditedIndividual/AccreditedOrganization vs the legacy Veteran::Service
      models); and the digital submission's individual-accept check (Accreditation vs the legacy
      Veteran::Service::OrganizationRepresentative join). Replaces the shared
      find_a_representative_use_accredited_models check for appoint controllers.
  arc_find_a_representative_backend_use_accredited_models:
    actor_type: user
    description: >
      Backend-only gate for the accredited_individuals and accredited_organizations
      (accredited model path) endpoints. Decoupled from the frontend toggle.
  arc_representative_status_use_accredited_models:
    actor_type: user
    description: >
      Backend-only switch for power_of_attorney#index data source.
      When enabled, queries the accredited models instead of the current source.
