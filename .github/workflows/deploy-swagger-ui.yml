name: Deploy Swagger UI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy-redis:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: development
      COVERBAND_DISABLE_AUTO_START: true
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: us-gov-west-1

      - uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/vets-api/prod/env_vars/BUNDLE_ENTERPRISE__CONTRIBSYS__COM
          env_variable_name: BUNDLE_ENTERPRISE__CONTRIBSYS__COM

      - name: Generate cross-repo token for gems
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          client-id: ${{ vars.GEM_APP_CLIENT_ID }}
          private-key: ${{ secrets.GEM_APP_PRIVATE_KEY }}
          owner: software
          github-api-url: https://va.ghe.com/api/v3

      - name: Install pdftk
        run: sudo apt-get update && sudo apt-get install -y pdftk-java

      - name: Setup Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af
        env:
          BUNDLE_VA__GHE__COM: x-access-token:${{ steps.app-token.outputs.token }}
        with:
          bundler-cache: true

      - name: Generate apidocs JSON
        run: |
          bundle exec rails runner \
            'File.write("public/api-reference/apidocs.json", Swagger::Blocks.build_root_json(V0::ApidocsController::SWAGGERED_CLASSES).to_json)' \
            2>&1 | tee /tmp/rails-runner.log || true
          cat /tmp/rails-runner.log
          test -s public/api-reference/apidocs.json || (echo "apidocs.json was not generated" && exit 1)

      - name: Update index.html to point to local JSON
        run: |
          sed -i 's|https://dev-api.va.gov/v0/apidocs|./apidocs.json|g' public/api-reference/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public/api-reference
