name: Notify Mobile team of PR needing review
on:
  pull_request:
    paths:
      - 'modules/mobile/**'
    types: [ready_for_review]

permissions:
  id-token: write
  pull-requests: read

jobs:
  notify_mobile_team:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_HOST: va.ghe.com
    if: github.event.pull_request.base.ref == 'master'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: us-gov-west-1

      - uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/vets-api/common/SLACK_MOBILE_BOT_TOKEN
          env_variable_name: SLACK_API_TOKEN

      - uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/vets-api/common/SLACK_MOBILE_ALERTS_CHANNEL_ID
          env_variable_name: SLACK_CHANNEL_ID

      - name: Check if PR author is a mobile team member
        id: check_author
        run: |
          PR_AUTHOR=${{ github.event.pull_request.user.login }}
          IS_TEAM_MEMBER=false

          if gh api \
            --method GET \
            "orgs/software/teams/mobile-api-team/memberships/${PR_AUTHOR}" > /dev/null 2>&1; then
            echo "Author ${PR_AUTHOR} is a member of the mobile team."
            IS_TEAM_MEMBER=true
          fi

          echo "is_team_member=$IS_TEAM_MEMBER" >> "$GITHUB_OUTPUT"

      - name: Send Slack Notification
        if: steps.check_author.outputs.is_team_member == 'false'
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_API_TOKEN }}
          payload: |
            {
              "channel": ${{ env.SLACK_CHANNEL_ID }},
              "text": ":party-github: Attention <!subteam^S059TUBATEY> - a new PR (<${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>) has been opened that requires your review.\n*Title:* ${{ github.event.pull_request.title }}\n*Author:* <${{ github.event.pull_request.user.html_url }}|${{ github.event.pull_request.user.login }}>"
            }
