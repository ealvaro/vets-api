name: Notify Mobile team of PR needing review
on:
  pull_request:
    paths:
      - 'modules/mobile/**'
    types: [opened, ready_for_review, reopened]

permissions:
  id-token: write
  pull-requests: read

jobs:
  notify_mobile_team:
    runs-on: ubuntu-latest
    env:
      GH_HOST: va.ghe.com
    if: >-
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.draft == false
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.MOBILE_AWS_ASSUME_ROLE }}
          aws-region: us-gov-west-1

      - name: Inject FLAGSHIP_MOBILE_CLIENT_ID
        uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/va-mobile-app/dev/FLAGSHIP_MOBILE_CLIENT_ID
          env_variable_name: FLAGSHIP_MOBILE_CLIENT_ID

      - name: Inject FLAGSHIP_MOBILE_APP_PRIVATE_KEY
        uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/va-mobile-app/dev/FLAGSHIP_MOBILE_APP_PRIVATE_KEY
          env_variable_name: FLAGSHIP_MOBILE_APP_PRIVATE_KEY

      - uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/va-mobile-app/common/SLACK_MOBILE_BOT_TOKEN
          env_variable_name: SLACK_API_TOKEN

      - uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/va-mobile-app/common/SLACK_MOBILE_ALERTS_CHANNEL_ID
          env_variable_name: SLACK_CHANNEL_ID

      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.FLAGSHIP_MOBILE_CLIENT_ID }}
          private-key: ${{ env.FLAGSHIP_MOBILE_APP_PRIVATE_KEY }}

      - name: Check if PR author is a mobile team member
        id: check_author
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"

          # Look up the author's mobile-api-team membership. On any API error (e.g. 403/404)
          # `state` stays empty and we fall through to is_team_member=false.
          # A missed review request is worse than an extra ping.
          state=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "orgs/software/teams/mobile-api-team/memberships/${PR_AUTHOR}" \
            --jq '.state' 2>err.log) || true

          if [ -s err.log ]; then
            echo "Membership lookup error for ${PR_AUTHOR}:"
            cat err.log
          fi
          echo "Membership state for ${PR_AUTHOR}: '${state:-<none>}'"

          if [ "$state" = "active" ]; then
            echo "is_team_member=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_team_member=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack Notification
        if: steps.check_author.outputs.is_team_member == 'false'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_API_TOKEN }}
          payload: |
            {
              "channel": ${{ env.SLACK_CHANNEL_ID }},
              "text": ":party-github: Attention <!subteam^S059TUBATEY> - a new PR (<${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>) has been opened that requires your review.\n*Title:* ${{ github.event.pull_request.title }}\n*Author:* <${{ github.event.pull_request.user.html_url }}|${{ github.event.pull_request.user.login }}>"
            }
