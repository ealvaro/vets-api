name: Push CODEOWNERS to Platform Atlas
on:
  workflow_call:
  push:
    branches:
      - master
    paths:
      - '.github/CODEOWNERS'
permissions:
  contents: read
jobs:
  copy-codeowners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check codeowner changes
        id: check-codeowner-changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .github/CODEOWNERS

      - name: Generate cross-repo token for actions
        if: steps.check-codeowner-changes.outputs.any_changed == 'true'
        id: vsp-bot-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.VA_VSP_BOT_APP_ID }}
          private-key: ${{ secrets.VA_VSP_BOT_PRIVATE_KEY }}
          owner: software
          github-api-url: https://va.ghe.com/api/v3

      - name: Push CODEOWNERS updates to Atlas
        if: steps.check-codeowner-changes.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ steps.vsp-bot-app-token.outputs.token }}
          GH_HOST: va.ghe.com
        run: |
          set -euo pipefail
          DEST_REPO="software/platform-atlas"
          DEST_PATH="lib/codeowners/vets-api/CODEOWNERS"
          BRANCH="master"

          NEW_CONTENT_B64=$(base64 -w0 .github/CODEOWNERS)
          CONTENT_FILE=$(mktemp)
          trap 'rm -f "$CONTENT_FILE"' EXIT
          printf '%s' "$NEW_CONTENT_B64" > "$CONTENT_FILE"

          RESPONSE=$(gh api "/repos/${DEST_REPO}/contents/${DEST_PATH}?ref=${BRANCH}" 2>/dev/null || echo '{}')
          CURRENT_SHA=$(echo "$RESPONSE" | jq -r '.sha // empty')
          CURRENT_CONTENT=$(echo "$RESPONSE" | jq -r '.content // empty' | tr -d '\n')

          if [ "$CURRENT_CONTENT" = "$NEW_CONTENT_B64" ]; then
            echo "No changes to push"
            exit 0
          fi

          JQ_ARGS=(--arg msg "Auto update Atlas with Vets-API CODEOWNERS" \
                   --rawfile content "$CONTENT_FILE" \
                   --arg branch "$BRANCH" \
                   --arg name "va-vsp-bot" \
                   --arg email "70344339+va-vsp-bot@users.noreply.github.com")
          if [ -n "$CURRENT_SHA" ]; then
            JQ_ARGS+=(--arg sha "$CURRENT_SHA")
            PAYLOAD=$(jq -n "${JQ_ARGS[@]}" \
              '{message:$msg, content:$content, branch:$branch, sha:$sha,
                committer:{name:$name,email:$email}, author:{name:$name,email:$email}}')
          else
            PAYLOAD=$(jq -n "${JQ_ARGS[@]}" \
              '{message:$msg, content:$content, branch:$branch,
                committer:{name:$name,email:$email}, author:{name:$name,email:$email}}')
          fi

          echo "$PAYLOAD" | gh api --method PUT "/repos/${DEST_REPO}/contents/${DEST_PATH}" --input -
          rm -f "$CONTENT_FILE"
