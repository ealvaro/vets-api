name: Security Alert Notifications

on:
  schedule:
    - cron: '3 17 * * 1-5' # Weekdays 17:03 UTC (~12–1 PM ET, depending on DST)
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: us-gov-west-1

      - name: Get Slack bot token
        uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /devops/github_actions_slack_bot_user_token
          env_variable_name: SLACK_BOT_TOKEN

      - name: Check and notify security alerts
        uses: software/vsp-github-actions/security-alert-slack-notify@3fccd42ba6c130f61c420e12a97e80bbd49905e4 # main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          slack_bot_token: ${{ env.SLACK_BOT_TOKEN }}
          channel_id: 'C02RLAUM2LV'
          alert_types: 'code_scanning,secret_scanning'
