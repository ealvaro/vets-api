name: Security Alert Notifications

on:
  schedule:
    - cron: '3 17 * * 1-5' # Weekdays 17:03 UTC (~12–1 PM ET, depending on DST)
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: us-gov-west-1

      - name: Get Slack bot token
        uses: software/action-inject-ssm-secrets@d8e6de3bde4dd728c9d732baef58b3c854b8c4bb # latest
        with:
          ssm_parameter: /devops/github_actions_slack_bot_user_token
          env_variable_name: SLACK_BOT_TOKEN

      - name: Check and notify security alerts
        uses: software/vsp-github-actions/security-alert-slack-notify@a74efa31a25d7fa797208e477a48fd0a34bc9d1c # main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          slack_bot_token: ${{ env.SLACK_BOT_TOKEN }}
          channel_id: 'C02RLAUM2LV'
          alert_types: 'code_scanning,secret_scanning'
