name: 'Update DataDog Service Catalog'

on:
  push:
    branches:
      - master
    paths:
      - "datadog-service-catalog/**.yml"

permissions:
  contents: read
  id-token: write

jobs:
  get_files:
    name: 'Get all modified and added files'
    runs-on: ubuntu-latest
    outputs:
      files: ${{steps.check_updated_services.outputs.files}}
    steps:
      - name: 'Checkout repo'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - id: check_updated_services
        name: 'Git diff for changes and output matrix of file names'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            before=${{ github.event.pull_request.base.sha }}
            after=${{ github.event.pull_request.head.sha }}
          else
            before=${{ github.event.before }}
            after=${{ github.event.after }}
          fi
          arr=$(jq -ncR '[inputs]' <<< $(git diff $before $after --diff-filter=AM --name-only -- "datadog-service-catalog/**.yml" | grep -v "datadog-service-catalog/datadog-service-catalog.yml"))
          out=$(echo $arr | jq -c '[.[] | select(. != "" and . != "datadog-service-catalog/datadog-service-catalog.yml")]')
          echo $out
          echo "files=$out" >> $GITHUB_OUTPUT

  update_dd:
    name: 'Update DD with changes'
    if: needs.get_files.outputs.files != '[]' && needs.get_files.outputs.files != ''
    runs-on: ubuntu-latest
    needs:
      - get_files
    strategy:
      matrix:
        file: ${{fromJSON(needs.get_files.outputs.files)}}
    steps:
      - name: 'Checkout repo'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: us-gov-west-1

      - uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/vets-api/prod/env_vars/DD_API_KEY
          env_variable_name: DD_API_KEY

      - uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/vets-api/prod/env_vars/DD_APP_KEY
          env_variable_name: DD_APP_KEY

      - name: 'Debug'
        run: |
          echo "File: ${{matrix.file}}"
          ls -la datadog-service-catalog/

      - id: read_yaml
        name: 'Read in the Service Catalog data'
        uses: mikefarah/yq@e2f1d5ccf73239195bf92280cd47596751492449 # master
        with:
          cmd: yq '.' ${{matrix.file}}

      - name: 'Get service name from file'
        id: parse_service_name
        uses: mikefarah/yq@e2f1d5ccf73239195bf92280cd47596751492449 # master
        with:
          cmd: yq -o=json '.dd-service' ${{matrix.file}}

      - name: 'Get schema version from file'
        id: parse_schema_version
        uses: mikefarah/yq@e2f1d5ccf73239195bf92280cd47596751492449 # master
        with:
          cmd: yq -o=json '."schema-version"' ${{matrix.file}}

      - name: 'Update Service Catalog in DataDog'
        run: |
          service=${{steps.parse_service_name.outputs.result}}
          schema=${{steps.parse_schema_version.outputs.result}}
          echo "Updating $service@$schema to Datadog Service Catalog"
          curl --fail-with-body --location --request POST "https://api.ddog-gov.com/api/v2/services/definitions?schema_version=$schema" \
          --header 'Accept: application/json' \
          --header 'DD-API-KEY: ${{ env.DD_API_KEY }}' \
          --header 'DD-APPLICATION-KEY: ${{ env.DD_APP_KEY }}' \
          --header 'Content-Type: text/plain' \
          --data "${{ steps.read_yaml.outputs.result}}"
