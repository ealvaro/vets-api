name: Delete Datadog service from Datadog
on:
  push:
    branches:
      - master
    paths:
      - "datadog-service-catalog/**.yml"

permissions:
  contents: read
  id-token: write

jobs:
  get_deleted_services:
    name: 'Get deleted service filenames'
    runs-on: ubuntu-latest
    outputs:
      files: ${{steps.check_deleted_services.outputs.files}}
    steps:
      - name: 'Checkout repo'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - id: check_deleted_services
        name: 'Check for deleted DataDog service files'
        run: |
          arr=$(jq -ncR '[inputs]' <<< $(git diff ${{ github.event.before }} ${{ github.event.after }} --diff-filter=D --name-only -- "datadog-service-catalog/**.yml"))
          out=$(echo $arr | jq -c '[.[] | select(. != "" and . != "datadog-service-catalog/datadog-service-catalog.yml")]')
          echo $out
          echo "files=$out" >> $GITHUB_OUTPUT

  delete_services:
    name: 'Delete services from Datadog'
    runs-on: ubuntu-latest
    if: needs.get_deleted_services.outputs.files != '[]' && needs.get_deleted_services.outputs.files != ''
    needs:
      - get_deleted_services
    strategy:
      matrix:
        file: ${{fromJSON(needs.get_deleted_services.outputs.files)}}
    steps:
      - name: 'Checkout master branch'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ github.event.before }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: us-gov-west-1

      - uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/vets-api/prod/env_vars/DD_API_KEY
          env_variable_name: DD_API_KEY

      - uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/vets-api/prod/env_vars/DD_APP_KEY
          env_variable_name: DD_APP_KEY

      - name: 'Get service name from file'
        id: parse_service_name
        uses: mikefarah/yq@8e2c9b612d3dabc6fe1390dfdca2af49bf4c6e66 # master
        with:
          cmd: yq -o=json '.dd-service' ${{matrix.file}}

      - name: 'Get schema version from file'
        id: parse_schema_version
        uses: mikefarah/yq@8e2c9b612d3dabc6fe1390dfdca2af49bf4c6e66 # master
        with:
          cmd: yq -o=json '.schema-version' ${{matrix.file}}

      - name: 'Delete service'
        run: |
              service=${{steps.parse_service_name.outputs.result}}
              schema=${{steps.parse_schema_version.outputs.result}}
              echo "Deleting $service@$schema from Datadog Service Catalog"
              curl --fail-with-body --location --request DELETE "https://api.ddog-gov.com/api/v2/services/definitions/$service?schema_version=$schema" \
              --header 'Accept: application/json' \
              --header 'DD-API-KEY: ${{ env.DD_API_KEY }}' \
              --header 'DD-APPLICATION-KEY: ${{ env.DD_APP_KEY }}'
