name: Build, Push, & Deploy
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Code Checks"]
    branches: master
    types: [completed]
permissions:
  id-token: write
  contents: read
jobs:
  debug_workflow_context:
    runs-on: ubuntu-latest
    name: Debug Workflow Context
    steps:
      - name: Compare commit ids and workflow details
        run: |
          echo "github.sha: ${{ github.sha }}"
          echo "github.event.push.head_commit.id: ${{ github.event.push.head_commit.id }}"
          echo "github.event.pull_request.merge_commit_sha: ${{ github.event.pull_request.merge_commit_sha }}"
          echo "github.event.head_commit.id: ${{ github.event.head_commit.id }}"
          echo "github.event.workflow_run.head_commit.id: ${{ github.event.workflow_run.head_commit.id }}"
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_name: ${{ github.ref_name }}"
          echo "github.event.workflow_run.name: ${{ github.event.workflow_run.name }}"
          echo "github.event.workflow_run.conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "github.event.workflow_run.event: ${{ github.event.workflow_run.event }}"
          echo "github.event_name: ${{ github.event_name }}"

  build_and_push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_commit.id }}

      - name: Setup Environment
        run: echo "VETS_API_USER_ID=$(id -u)" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: us-gov-west-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/vets-api/prod/env_vars/BUNDLE_ENTERPRISE__CONTRIBSYS__COM
          env_variable_name: BUNDLE_ENTERPRISE__CONTRIBSYS__COM

      - name: Fetch GeoLite2 database from S3
        continue-on-error: true
        run: |
          mkdir -p geoip
          aws s3 cp "s3://identity-geoip-prd/GeoLite2-City.mmdb" geoip/GeoLite2-City.mmdb

      - name: Set ECR repository
        run: echo "ECR_REPOSITORY=dsva/vets-api" >> $GITHUB_ENV

      - name: Build Postman Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: ./postman
          file: ./postman/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/dsva/vets-api-postman:${{ github.event.workflow_run.head_commit.id }}

      - name: Generate cross-repo token for gems
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.GEM_APP_CLIENT_ID }}
          private-key: ${{ secrets.GEM_APP_PRIVATE_KEY }}
          owner: software
          github-api-url: https://va.ghe.com/api/v3

      - name: Build vets-api Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          build-args: |
            BUNDLE_ENTERPRISE__CONTRIBSYS__COM=${{ env.BUNDLE_ENTERPRISE__CONTRIBSYS__COM }}
            BUNDLE_VA__GHE__COM=x-access-token:${{ steps.app-token.outputs.token }}
            USER_ID=${{ env.VETS_API_USER_ID }}
            RAILS_ENV=production
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_commit.id }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-to: type=inline
  deploy:
    needs: build_and_push
    if: ${{ github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success' }}
    uses: software/vets-api/.github/workflows/deploy-template.yml@master
    with:
      ecr_repository: "vets-api"
      manifests_directory: "vets-api"
      auto_deploy_envs: "dev staging prod sandbox"
      commit_sha: ${{ github.event.workflow_run.head_commit.id }}
    secrets:
      va_vsp_bot_private_key: ${{ secrets.VA_VSP_BOT_PRIVATE_KEY }}

  cleanup_caches:
    needs: build_and_push
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old CodeQL trap caches, keep only latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/caches" \
            --hostname va.ghe.com \
            --jq '.actions_caches[] | select(.key | startswith("codeql-trap-")) | {id, created_at}' | \
          jq -s 'sort_by(.created_at) | reverse | .[1:] | .[].id' | \
          while read -r id; do
            gh api --hostname va.ghe.com --silent -X DELETE \
              "repos/${{ github.repository }}/actions/caches/$id" || true
          done
