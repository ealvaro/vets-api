name: Yardoc

# check documentation in specified paths
on: # `on` parses to `true` in ruby
  pull_request:
    paths:
      # https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#patterns-to-match-file-paths
      - lib/lighthouse/benefits_intake/**/*.rb
      - lib/logging/**/*.rb
      - lib/pdf_utilities/exception_handling.rb
      - lib/pdf_utilities/pdf_stamper.rb
      - lib/veteran_facing_services/**/*.rb
      - modules/burials/**/*.rb
      - modules/claims_evidence_api/**/*.rb
      - modules/dependents_benefits/**/*.rb
      - modules/digital_forms_api/**/*.rb
      - modules/income_and_assets/**/*.rb
      - modules/medical_expense_reports/**/*.rb
      - modules/pensions/**/*.rb
      - modules/validations/**/*.rb

permissions:
  contents: read
  id-token: write
  pull-requests: write
  statuses: write

jobs:
  yardoc:
    name: Yardoc

    env:
      COVERBAND_DISABLE_AUTO_START: true

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Fetch target branch
        run: git fetch origin "${GITHUB_BASE_REF}" --depth=1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: us-gov-west-1

      - uses: software/action-inject-ssm-secrets@47689845c2a46848eb5455078d9261c8dfe5e521 # latest
        with:
          ssm_parameter: /dsva-vagov/vets-api/prod/env_vars/BUNDLE_ENTERPRISE__CONTRIBSYS__COM
          env_variable_name: BUNDLE_ENTERPRISE__CONTRIBSYS__COM

      - name: Generate cross-repo token for gems
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.GEM_APP_CLIENT_ID }}
          private-key: ${{ secrets.GEM_APP_PRIVATE_KEY }}
          owner: software
          github-api-url: https://va.ghe.com/api/v3

      - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        env:
          BUNDLE_VA__GHE__COM: x-access-token:${{ steps.app-token.outputs.token }}
        with:
          bundler-cache: true

      - name: Run Yardoc
        run: bundle exec rake yardoc
