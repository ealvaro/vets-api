benefit_summary:
  subtitle: Choose topics to include
  paragraphs:
    - This letter confirms your service history and that you receive VA benefits. It may help you qualify for certain state or local programs. You can customize it to meet your needs.
    - 'When to use this letter:'
  lists:
    - items:
      - Applying for housing assistance
      - Applying for a civil service job
      - Reducing property taxes
      - Reducing car taxes

benefit_verification:
  paragraphs:
    - This letter confirms how much money you receive in VA benefits each month.
    - 'When to use this letter:'
  lists:
    - items:
      - Applying for a car loan
      - Applying for a mortgage

certificate_of_eligibility:
  paragraphs:
    - This letter shows that you’re eligible for a VA home loan.

certificate_of_eligibility_home_loan:
  paragraphs:
    - This letter shows that you’re eligible for a VA home loan.

proof_of_service:
  paragraphs:
    - This card confirms that you served in the military. You may need it to access Veteran discounts or programs.
    - 'When to use this letter:'
  lists:
    - items:
      - Requesting Veteran discounts
      - Accessing Veteran-only programs or community services
      - Verifying service history for non-financial purposes

service_verification:
  paragraphs:
    - This letter shows your branch of service, the date you started active duty, and the date you were discharged from active duty.

civil_service:
  paragraphs:
    - This letter confirms that you’re a disabled Veteran and may qualify for preference in civil service jobs.
    - 'When to use this letter:'
  lists:
    - items:
      - Applying for a federal government job
      - Applying for state or local civil service positions
      - Providing documentation supporting Veterans’ hiring preference
      - Submitting materials through USAJOBS or similar public-sector hiring systems

minimum_essential_coverage:
  paragraphs:
    - This letter confirms that you have minimum essential health coverage required by the Affordable Care Act (ACA).
    - 'When to use this letter:'
  lists:
    - items:
      - Filing your taxes
      - Applying for something that requires proof of health insurance

medicare_partd:
  paragraphs:
    - This letter confirms that you have creditable prescription drug coverage.
    - You can use this letter to apply for Medicare Part D prescription drug coverage.

commissary:
  paragraphs:
    - This letter confirms that you’re eligible to shop at a military commissary or exchange.
    - 'When to use this letter:'
  lists:
    - items:
      - Registering for commissary or exchange privileges
      - Verifying eligibility for base shopping access
      - Providing documentation supporting commissary benefits
      - Updating access status with base staff

foreign_medical_program:
  paragraphs:
    - This letter confirms your enrollment in the Foreign Medical Program (FMP).
    - 'When to use this letter:'
  lists:
    - items:
      - Seeking medical care outside the United States
      - Providing documentation to an overseas provider
      - Confirming FMP enrollment status

tsa:
  paragraphs:
    - This letter confirms that you qualify for a TSA PreCheck application fee waiver.
    - You can use this letter to qualify for a TSA PreCheck application fee waiver.