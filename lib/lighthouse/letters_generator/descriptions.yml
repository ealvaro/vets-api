benefit_summary:
  subtitle: Choose topics to include
  content:
    - type: paragraph
      text: This letter confirms your service history and that you receive VA benefits. It may help you qualify for certain state or local programs. You can customize it to meet your needs.
    - type: paragraph
      text: 'When to use this letter:'
    - type: list
      items:
        - Applying for housing assistance
        - Applying for a civil service job
        - Reducing property taxes
        - Reducing car taxes

benefit_verification:
  content:
    - type: paragraph
      text: This letter confirms how much money you receive in VA benefits each month.
    - type: paragraph
      text: 'When to use this letter:'
    - type: list
      items:
        - Applying for a car loan
        - Applying for a mortgage

certificate_of_eligibility:
  content:
    - type: paragraph
      text: This letter shows that you’re eligible for a VA home loan.

certificate_of_eligibility_home_loan:
  content:
    - type: paragraph
      text: This letter shows that you’re eligible for a VA home loan.

proof_of_service:
  content:
    - type: paragraph
      text: This card confirms that you served in the military. You may need it to access Veteran discounts or programs.
    - type: paragraph
      text: 'When to use this letter:'
    - type: list
      items:
        - Requesting Veteran discounts
        - Accessing Veteran-only programs or community services
        - Verifying service history for non-financial purposes

service_verification:
  content:
    - type: paragraph
      text: This letter shows your branch of service, the date you started active duty, and the date you were discharged from active duty.

civil_service:
  content:
    - type: paragraph
      text: This letter confirms that you’re a disabled Veteran and may qualify for preference in civil service jobs.
    - type: paragraph
      text: 'When to use this letter:'
    - type: list
      items:
        - Applying for a federal government job
        - Applying for state or local civil service positions
        - Providing documentation supporting Veterans’ hiring preference
        - Submitting materials through USAJOBS or similar public-sector hiring systems

minimum_essential_coverage:
  content:
    - type: paragraph
      text: 'This letter confirms that you have:'
    - type: list
      items:
        - Minimum essential health coverage under the Affordable Care Act (ACA)
        - Creditable prescription drug coverage
    - type: paragraph
      text: 'When to use this letter:'
    - type: list
      items:
        - Filing your taxes
        - Applying for Medicare Part D prescription drug coverage
        - Applying for anything that requires proof of health insurance

commissary:
  content:
    - type: paragraph
      text: This letter confirms that you’re eligible to shop at a military commissary or exchange.
    - type: paragraph
      text: 'When to use this letter:'
    - type: list
      items:
        - Registering for commissary or exchange privileges
        - Verifying eligibility for base shopping access
        - Providing documentation supporting commissary benefits
        - Updating access status with base staff

foreign_medical_program:
  content:
    - type: paragraph
      text: This letter confirms your enrollment in the Foreign Medical Program (FMP).
    - type: paragraph
      text: 'When to use this letter:'
    - type: list
      items:
        - Seeking medical care outside the United States
        - Providing documentation to an overseas provider
        - Confirming FMP enrollment status

tsa:
  content:
    - type: paragraph
      text: This letter confirms that you qualify for a TSA PreCheck application fee waiver.
    - type: paragraph
      text: You can use this letter to qualify for a TSA PreCheck application fee waiver.